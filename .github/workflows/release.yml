name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      # 一个平台失败不取消其它平台 —— 否则 Windows 成功、macOS 失败时
      # 连 Windows 的产物都会被 fail-fast 一并取消（实际踩过）。
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Python Worker 测试（随包发布前校验）
      - name: Python worker tests
        run: python -m unittest discover -s worker/tests

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npx vitest run

      - name: Typecheck
        run: npm run typecheck

      # 打包但不上传：发布交给下面的 action。
      # electron-builder 自带的 GitHub publisher 在 CI 上不产出任何资产
      # （工作流显示成功、Release 页却什么都没有），已弃用。
      - name: Build & package
        run: |
          npm run build
          npx electron-builder --config electron-builder.yml --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # 诊断：把产物清单写进 job summary。Release 页看不到安装包时，
      # 这里能直接确认构建到底产出了什么文件（CI 日志需要登录才能看）。
      - name: List artifacts (diagnostics)
        shell: bash
        run: |
          {
            echo "## ${{ matrix.os }} 构建产物"
            echo '```'
            ls -la release/*/ 2>/dev/null || echo "release/*/ 不存在"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # 单层 * 只匹配 release/<version>/ 下的安装器，不会把
          # win-unpacked/ 里数百 MB 的应用二进制一起收进来。
          # latest*.yml 是自动更新元数据，builder-*.yml 是调试配置，不上传。
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/latest*.yml
            release/*/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/latest*.yml
            release/*/*.blockmap
          # 各平台产物不同（mac 没有 .exe），不能因单个模式未命中就失败；
          # 真正的把关交给下面的校验步骤。
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传后校验：Release 必须真有本平台的安装包，否则这步报红。
      # 目的是杜绝"工作流全绿、Release 却空着"这种最难排查的失败。
      - name: Verify release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true)
          {
            echo "## ${{ matrix.os }} → Release 资产"
            echo '```'
            echo "${names:-<空>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.os }}" in
            windows-latest) want='\.exe$' ;;
            macos-latest) want='\.dmg$' ;;
            ubuntu-latest) want='\.AppImage$' ;;
          esac
          if ! printf '%s\n' "$names" | grep -Eq "$want"; then
            echo "::error::Release 缺少 ${{ matrix.os }} 的安装包（资产清单见 job summary）"
            exit 1
          fi
