name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Python Worker 测试（随包发布前校验）
      - name: Python worker tests
        run: python -m unittest discover -s worker/tests

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npx vitest run

      - name: Typecheck
        run: npm run typecheck

      - name: Build & package
        shell: bash
        # 直接调用 electron-builder（不再用已归档的 samuelmeuli/action-electron-builder：
        # 它对未知输入名直接报错 —— 曾因 gh_token vs github_token 让构建在第一步就失败）。
        # 打 tag 时用 --publish always 上传到 GitHub Release；否则只做本地打包验证。
        run: |
          npm run build
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npx electron-builder --config electron-builder.yml --publish always
          else
            npx electron-builder --config electron-builder.yml
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
