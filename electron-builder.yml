appId: com.instadownloader.app
productName: InstaDownloader
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
asar: true
extraResources:
  - from: worker
    to: worker
    filter:
      - "**/*.py"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
linux:
  icon: build/icon.png
  target: AppImage
  category: Utility
publish:
  provider: github
  # 默认 draft：需要人工到 GitHub 手动发布，CI 产物不会自动对外可见
  # （表现为"工作流成功但 Release 页没有安装包"）。改为直接发布正式版。
  releaseType: release
